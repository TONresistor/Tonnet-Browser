<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f5;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.4);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --surface-active: rgba(255, 255, 255, 0.12);
      --primary: #0098ea;
      --separator: rgba(255, 255, 255, 0.08);
      --radius: 14px;
      --blur: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      background: var(--bg);
      backdrop-filter: blur(var(--blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      overflow: hidden;
      max-height: 100%;
      overflow-y: auto;
    }

    #root:empty {
      display: none;
    }

    /* Scrollbar */
    #root::-webkit-scrollbar { width: 6px; }
    #root::-webkit-scrollbar-track { background: transparent; }
    #root::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }

    /* Suggestion items */
    .suggestion-item {
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 80ms;
    }

    .suggestion-item:hover,
    .suggestion-item.selected {
      background: var(--surface-hover);
    }

    .suggestion-item:active {
      background: var(--surface-active);
    }

    .suggestion-title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-url {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .suggestion-visits {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: auto;
      flex-shrink: 0;
    }

    .suggestion-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Menu items */
    .menu-item {
      display: flex;
      align-items: center;
      padding: 9px 14px;
      margin: 2px 4px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 8px;
      transition: background 80ms;
    }

    .menu-item:hover,
    .menu-item.selected {
      background: var(--surface-hover);
    }

    .menu-item:active {
      background: var(--surface-active);
    }

    .menu-item.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .menu-separator {
      height: 1px;
      background: var(--separator);
      margin: 4px 0;
    }

    .menu-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      opacity: 0.7;
    }

    .menu-item.destructive {
      color: #ff453a;
    }

    /* Form */
    .form-container {
      padding: 20px;
    }

    .form-title {
      font-weight: bold;
      color: var(--text);
      margin-bottom: 16px;
      font-size: 14px;
    }

    .form-field {
      margin-bottom: 12px;
    }

    .form-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: block;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      transition: border-color 120ms;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .form-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 150ms;
    }

    .form-btn-secondary {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .form-btn-secondary:hover {
      color: var(--text);
    }

    .form-btn-primary {
      background: rgba(0, 152, 234, 0.9);
      color: var(--text);
      box-shadow: 0 4px 12px rgba(0, 152, 234, 0.4);
    }

    .form-btn-primary:hover {
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const root = document.getElementById('root')
    let selectedIndex = -1
    let currentItems = []

    function renderSuggestions(items) {
      currentItems = items
      selectedIndex = -1
      root.innerHTML = ''

      for (let i = 0; i < items.length; i++) {
        const item = items[i]
        const el = document.createElement('div')
        el.className = 'suggestion-item'
        el.dataset.index = i

        const row = document.createElement('div')
        row.className = 'suggestion-row'

        const title = document.createElement('span')
        title.className = 'suggestion-title'
        title.textContent = item.title || item.url

        const visits = document.createElement('span')
        visits.className = 'suggestion-visits'
        visits.textContent = item.visitCount > 1 ? `${item.visitCount}x` : ''

        row.appendChild(title)
        row.appendChild(visits)

        const url = document.createElement('div')
        url.className = 'suggestion-url'
        url.textContent = item.url

        el.appendChild(row)
        el.appendChild(url)

        el.addEventListener('click', () => {
          window.overlayBridge.sendAction('select', { id: item.id, url: item.url, index: i })
        })

        root.appendChild(el)
      }
    }

    function renderMenu(items) {
      currentItems = items
      selectedIndex = -1
      root.innerHTML = ''

      for (let i = 0; i < items.length; i++) {
        const item = items[i]

        if (item.separator) {
          const sep = document.createElement('div')
          sep.className = 'menu-separator'
          root.appendChild(sep)
          continue
        }

        const el = document.createElement('div')
        el.className = 'menu-item' + (item.disabled ? ' disabled' : '') + (item.destructive ? ' destructive' : '')
        el.dataset.index = i

        if (item.icon) {
          const icon = document.createElement('span')
          icon.className = 'menu-icon'
          icon.textContent = item.icon
          el.appendChild(icon)
        }

        const label = document.createElement('span')
        label.textContent = item.label
        el.appendChild(label)

        el.addEventListener('click', () => {
          if (!item.disabled) {
            window.overlayBridge.sendAction(item.id, item.data || {})
          }
        })

        root.appendChild(el)
      }
    }

    function renderForm(content) {
      currentItems = []
      selectedIndex = -1
      root.innerHTML = ''

      const container = document.createElement('div')
      container.className = 'form-container'

      const title = document.createElement('div')
      title.className = 'form-title'
      title.textContent = content.title || ''
      container.appendChild(title)

      const inputs = {}

      for (const field of (content.fields || [])) {
        const fieldEl = document.createElement('div')
        fieldEl.className = 'form-field'

        const label = document.createElement('label')
        label.className = 'form-label'
        label.textContent = field.label || ''
        fieldEl.appendChild(label)

        const input = document.createElement('input')
        input.className = 'form-input'
        input.value = field.value || ''
        input.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            e.preventDefault()
            collectAndSend('save')
          } else if (e.key === 'Escape') {
            e.preventDefault()
            window.overlayBridge.sendAction('dismiss', {})
          }
        })
        fieldEl.appendChild(input)
        inputs[field.id] = input

        container.appendChild(fieldEl)
      }

      function collectAndSend(actionId) {
        const values = {}
        for (const [id, input] of Object.entries(inputs)) {
          values[id] = input.value
        }
        window.overlayBridge.sendAction(actionId, values)
      }

      const actionsRow = document.createElement('div')
      actionsRow.className = 'form-actions'

      for (const action of (content.actions || [])) {
        const btn = document.createElement('button')
        btn.className = 'form-btn ' + (action.primary ? 'form-btn-primary' : 'form-btn-secondary')
        btn.textContent = action.label || action.id
        btn.addEventListener('click', () => {
          if (action.id === 'dismiss') {
            window.overlayBridge.sendAction('dismiss', {})
          } else {
            collectAndSend(action.id)
          }
        })
        actionsRow.appendChild(btn)
      }

      container.appendChild(actionsRow)
      root.appendChild(container)

      // Focus first input
      const firstInput = container.querySelector('.form-input')
      if (firstInput) firstInput.focus()
    }

    function updateSelection(index) {
      const items = root.querySelectorAll('.suggestion-item, .menu-item:not(.disabled)')
      items.forEach((el) => el.classList.remove('selected'))

      if (index >= 0 && index < items.length) {
        items[index].classList.add('selected')
        items[index].scrollIntoView({ block: 'nearest' })
      }

      selectedIndex = index
    }

    // Listen for content updates
    window.overlayBridge.onContent((content) => {
      if (!content) {
        root.innerHTML = ''
        currentItems = []
        selectedIndex = -1
        return
      }

      if (content.type === 'suggestions' && content.items) {
        renderSuggestions(content.items)
      } else if (content.type === 'menu' && content.items) {
        renderMenu(content.items)
      } else if (content.type === 'form') {
        renderForm(content)
      }
    })

    // Listen for theme updates
    window.overlayBridge.onTheme((theme) => {
      if (!theme) return
      const rootEl = document.documentElement
      for (const [key, value] of Object.entries(theme)) {
        rootEl.style.setProperty(key, value)
      }
    })

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
      const selectableItems = root.querySelectorAll('.suggestion-item, .menu-item:not(.disabled)')
      const count = selectableItems.length
      if (count === 0) return

      if (e.key === 'ArrowDown') {
        e.preventDefault()
        updateSelection(selectedIndex < count - 1 ? selectedIndex + 1 : 0)
      } else if (e.key === 'ArrowUp') {
        e.preventDefault()
        updateSelection(selectedIndex > 0 ? selectedIndex - 1 : count - 1)
      } else if (e.key === 'Enter' && selectedIndex >= 0) {
        e.preventDefault()
        selectableItems[selectedIndex].click()
      } else if (e.key === 'Escape') {
        e.preventDefault()
        window.overlayBridge.sendAction('dismiss', {})
      }
    })

    // Click-outside is handled by the main process (overlay-manager.ts)
    // Do NOT use blur here — it causes race conditions with menu->form transitions
  </script>
</body>
</html>
