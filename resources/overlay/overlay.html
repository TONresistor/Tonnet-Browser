<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.12);
      --text: #f5f5f5;
      --text-secondary: rgba(255, 255, 255, 0.6);
      --text-muted: rgba(255, 255, 255, 0.4);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --surface-active: rgba(255, 255, 255, 0.12);
      --primary: #0098ea;
      --separator: rgba(255, 255, 255, 0.08);
      --radius: 14px;
      --blur: 12px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 13px;
      color: var(--text);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #root {
      background: var(--bg);
      backdrop-filter: blur(var(--blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      overflow: hidden;
      max-height: 100%;
      overflow-y: auto;
    }

    #root:empty {
      display: none;
    }

    /* Scrollbar */
    #root::-webkit-scrollbar { width: 6px; }
    #root::-webkit-scrollbar-track { background: transparent; }
    #root::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.15); border-radius: 3px; }

    /* Suggestion items */
    .suggestion-item {
      display: flex;
      flex-direction: column;
      padding: 8px 12px;
      cursor: pointer;
      transition: background 80ms;
    }

    .suggestion-item:hover,
    .suggestion-item.selected {
      background: var(--surface-hover);
    }

    .suggestion-item:active {
      background: var(--surface-active);
    }

    .suggestion-title {
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .suggestion-url {
      font-size: 11px;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .suggestion-visits {
      font-size: 10px;
      color: var(--text-muted);
      margin-left: auto;
      flex-shrink: 0;
    }

    .suggestion-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Menu items */
    .menu-item {
      display: flex;
      align-items: center;
      padding: 9px 14px;
      margin: 2px 4px;
      cursor: pointer;
      font-size: 13px;
      border-radius: 8px;
      transition: background 80ms;
    }

    .menu-item:hover,
    .menu-item.selected {
      background: var(--surface-hover);
    }

    .menu-item:active {
      background: var(--surface-active);
    }

    .menu-item.disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .menu-separator {
      height: 1px;
      background: var(--separator);
      margin: 4px 0;
    }

    .menu-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      opacity: 0.7;
    }

    .menu-item.destructive {
      color: #ff453a;
    }

    /* Form */
    .form-container {
      padding: 20px;
    }

    .form-title {
      font-weight: bold;
      color: var(--text);
      margin-bottom: 16px;
      font-size: 14px;
    }

    .form-field {
      margin-bottom: 12px;
    }

    .form-label {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      display: block;
    }

    .form-input {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
      box-sizing: border-box;
      transition: border-color 120ms;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .form-readonly {
      opacity: 0.8;
      cursor: default;
      font-size: 12px;
      line-height: 1.5;
      white-space: normal;
      border: none;
      background: transparent;
      padding: 0;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    .form-btn {
      flex: 1;
      padding: 10px 0;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: none;
      transition: all 150ms;
    }

    .form-btn-secondary {
      background: var(--surface-hover);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .form-btn-secondary:hover {
      color: var(--text);
    }

    .form-btn-primary {
      background: rgba(0, 152, 234, 0.9);
      color: var(--text);
      box-shadow: 0 4px 12px rgba(0, 152, 234, 0.4);
    }

    .form-btn-primary:hover {
      transform: scale(1.02);
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="overlay.js"></script>
</body>
</html>
