version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: '[deps]'
    open-pull-requests-limit: 10
    groups:
      dev-tools:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'prettier'
          - 'typescript*'
          - '@typescript-eslint/*'
          - 'vitest*'
          - '@vitest/*'
      react:
        patterns:
          - 'react*'
          - '@types/react*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: '[ci]'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
