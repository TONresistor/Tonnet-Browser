name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Validate: type-check, lint, format, tests, build
  # ─────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Electron binary
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: Cache Go binaries
        id: go-bin-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v4
        with:
          path: resources/bin/linux
          key: go-binaries-linux-${{ hashFiles('scripts/binary-versions.json') }}

      - name: Setup Go
        if: steps.go-bin-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v5
        with:
          go-version: '1.25'

      - name: Build Go binaries from source
        if: steps.go-bin-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-binaries-from-source.sh linux

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test coverage
        run: npm run test:coverage 2>&1 | tail -30

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore

      - name: Verify build compiles
        run: npm run build

      - name: Security audit
        run: npm audit --audit-level=critical

  # ─────────────────────────────────────────────
  # Notify: Telegram (push to main only)
  # ─────────────────────────────────────────────
  notify:
    needs: validate
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '-1003461541563'
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "Telegram bot token not configured, skipping"
            exit 0
          fi

          send() {
            local sha=$1 title body short url TEXT
            title=$(git log -1 --pretty=format:'%s' "$sha")
            body=$(git log -1 --pretty=format:'%b' "$sha" | head -20)
            short=$(git rev-parse --short "$sha")
            url="${{ github.server_url }}/${{ github.repository }}/commit/$sha"
            TEXT="<b>[Desktop] $title</b>"
            [ -n "$body" ] && printf -v TEXT '%s\n\n%s' "$TEXT" "$body"
            printf -v TEXT '%s\n\n<a href="%s">View commit %s</a>' "$TEXT" "$url" "$short"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d disable_web_page_preview="true" \
              -d text="$TEXT"
          }

          # Validate failed/cancelled: single fallback notif on HEAD
          if [ "$VALIDATE_RESULT" != "success" ]; then
            send "$AFTER_SHA"
            exit 0
          fi

          # Validate succeeded: notify per commit in the pushed range
          NULL_SHA="0000000000000000000000000000000000000000"
          if [ "$BEFORE_SHA" = "$NULL_SHA" ] || ! git merge-base --is-ancestor "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null; then
            COMMITS=$(git log --reverse --pretty=format:'%H' --max-count=20 "$AFTER_SHA")
          else
            COMMITS=$(git log --reverse --pretty=format:'%H' "$BEFORE_SHA..$AFTER_SHA")
          fi

          while IFS= read -r sha; do
            [ -z "$sha" ] && continue
            send "$sha"
            sleep 1
          done <<< "$COMMITS"

  # ─────────────────────────────────────────────
  # Dependency review (PRs only)
  # ─────────────────────────────────────────────
  dependency-review:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4

      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

