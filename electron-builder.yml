appId: com.bilanet.app
productName: BilaNet
directories:
  output: release

afterPack: "./scripts/afterPack.cjs"

publish:
  provider: github
  owner: xulytiengviet
  repo: Bilanet

files:
  - "out/**/*"
  - "package.json"
  - "resources/overlay/**/*"
  - "resources/preload/**/*"

extraResources:
  - from: "resources/config"
    to: "config"
    filter:
      - "**/*"
  - from: "resources/cocoon"
    to: "cocoon"
    filter:
      - "**/*"

linux:
  extraResources:
    - from: "resources/bin/linux"
      to: "bin"
      filter:
        - "**/*"
  target:
    - AppImage
    - deb
  category: Network
  icon: resources/icons/bilanet.svg
  artifactName: "BilaNet-${version}-${arch}.${ext}"

win:
  extraResources:
    - from: "resources/bin/win"
      to: "bin"
      filter:
        - "**/*"
  target:
    - nsis
    - portable
  icon: resources/icons/bilanet.svg

nsis:
  artifactName: "BilaNet-Setup-${version}.${ext}"

portable:
  artifactName: "BilaNet-Portable-${version}.${ext}"

mac:
  extraResources:
    - from: "resources/bin/mac"
      to: "bin"
      filter:
        - "**/*"
  target:
    - target: dmg
      arch: universal
  icon: resources/icons/bilanet.svg
  artifactName: "BilaNet-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  x64ArchFiles: "Contents/Resources/bin/*"
  identity: "-"
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# Electron fuses are configured per-platform in scripts/afterPack.cjs
# (cookieEncryption requires code signing on macOS; enabled on Linux/Windows only)
