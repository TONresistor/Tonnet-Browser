appId: com.tonbrowser.app
productName: TON Browser
directories:
  output: release

afterPack: "./scripts/afterPack.cjs"

publish:
  provider: github
  owner: TONresistor
  repo: Tonnet-Browser

files:
  - "out/**/*"
  - "package.json"
  - "resources/overlay/**/*"
  - "resources/preload/**/*"
  - "resources/icons/icon.png"

extraResources:
  - from: "resources/config"
    to: "config"
    filter:
      - "**/*"
  - from: "resources/cocoon"
    to: "cocoon"
    filter:
      - "**/*"

linux:
  extraResources:
    - from: "resources/bin/linux"
      to: "bin"
      filter:
        - "**/*"
  target:
    - AppImage
    - deb
  category: Network
  icon: resources/icons/icon.png
  artifactName: "TON-Browser-${version}-${arch}.${ext}"

win:
  extraResources:
    - from: "resources/bin/win"
      to: "bin"
      filter:
        - "**/*"
  target:
    - nsis
    - portable
  icon: resources/icons/icon.ico

nsis:
  artifactName: "TON-Browser-Setup-${version}.${ext}"

portable:
  artifactName: "TON-Browser-Portable-${version}.${ext}"

mac:
  extraResources:
    - from: "resources/bin/mac"
      to: "bin"
      filter:
        - "**/*"
  target:
    - target: dmg
      arch: universal
  icon: resources/icons/icon.icns
  artifactName: "TON-Browser-${version}-${arch}.${ext}"
  hardenedRuntime: true
  gatekeeperAssess: false
  x64ArchFiles: "Contents/Resources/bin/*"

# Electron fuses are configured per-platform in scripts/afterPack.cjs
# (cookieEncryption requires code signing on macOS; enabled on Linux/Windows only)
